name: Docker

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 8 * * *'
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref_type == 'tag' && 'release-tags' || github.ref }}

jobs:
  publish:
    name: Publish checked image to GHCR
    if: github.ref == 'refs/heads/master' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name and reproducible build timestamps
        id: source
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine deployment tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.source.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=ref,event=tag
            type=raw,value=tagged,enable=${{ github.ref_type == 'tag' }}
          labels: org.opencontainers.image.created=${{ steps.source.outputs.created }}
      - name: Build and stage image by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64
          pull: true
          labels: ${{ steps.meta.outputs.labels }}
          # Keep the digest stable when a scheduled rebuild produces the same image.
          provenance: false
          outputs: type=image,name=${{ steps.source.outputs.image }},push=true,push-by-digest=true,name-canonical=true,rewrite-timestamp=true
          cache-from: type=gha,scope=beagen
          cache-to: type=gha,scope=beagen,mode=max
      - name: Pull staged image
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        shell: bash
        run: docker pull "${IMAGE}@${DIGEST}"
      - name: Test and scan the staged image
        uses: ./.github/actions/check-container
        with:
          image: ${{ steps.source.outputs.image }}@${{ steps.image.outputs.digest }}
          block-on-fixable: 'true'
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the digest and update deployment tags
        env:
          IMAGE: ${{ steps.source.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == 'refs/heads/master' ]]; then
            current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/master" --jq '.object.sha')"
            if [[ "$current_head" != "$GITHUB_SHA" ]]; then
              echo "A newer commit is on master. Skipping deployment of this build."
              exit 0
            fi
          fi

          promotion=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              if ! current="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$tag" 2>&1)"; then
                if [[ "${current,,}" == *"${tag,,}: not found"* || "${current,,}" == *'manifest unknown'* ]]; then
                  current=''
                else
                  printf '%s\n' "$current" >&2
                  exit 1
                fi
              fi
              if [[ "$GITHUB_REF_TYPE" == 'tag' && "$tag" != "$IMAGE:tagged" && -n "$current" ]]; then
                echo "Release image $tag is already published."
                exit 0
              fi
              if [[ "$current" != "$DIGEST" ]]; then
                promotion+=(--tag "$tag")
              fi
            fi
          done <<< "$TAGS"

          if (( ${#promotion[@]} == 0 )); then
            echo "Deployment tags already reference this digest."
            exit 0
          fi

          cosign sign --yes "${IMAGE}@${DIGEST}"
          docker buildx imagetools create --prefer-index=false "${promotion[@]}" "${IMAGE}@${DIGEST}"
          printf 'Promoted image digest: %s@%s\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
