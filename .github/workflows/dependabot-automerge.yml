name: Dependabot Maven merge

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-maven-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata:
    if: >-
      vars.DEPENDABOT_AUTO_MERGE == 'true' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.versions.outputs.eligible }}
    steps:
      # The metadata action verifies the first commit. Limit automation to one
      # commit and tie its verification to the revision from this event.
      - name: Confirm the signed PR revision
        id: revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          commits=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=2")
          if jq -e --arg head "$PR_HEAD_SHA" '
            length == 1 and .[0].sha == $head and .[0].author.login == "dependabot[bot]"
            and .[0].commit.verification.verified == true
          ' > /dev/null <<< "$commits"; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi

      # Never check out PR code in this workflow.
      - name: Verify Dependabot metadata
        id: metadata
        if: steps.revision.outputs.eligible == 'true'
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Verify every Maven update stays in its current major release
        id: versions
        if: >-
          steps.metadata.outputs.package-ecosystem == 'maven' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        shell: bash
        env:
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          if jq -e '
            # Accept numeric Maven releases with optional stable qualifiers such as .Final.
            def release:
              (try capture("^(?<major>[0-9]{1,9})\\.(?<minor>[0-9]{1,9})(?:\\.(?<patch>[0-9]{1,9}))?(?:\\.(?<revision>[0-9]{1,9}))?(?:[.-](?:final|ga|release))?$"; "i") catch null) // null
              | if . == null then null
                else [.major, .minor, (.patch // "0"), (.revision // "0")] | map(tonumber)
                end;
            def permitted_update:
              (.prevVersion | release) as $old
              | (.newVersion | release) as $new
              | $old != null and $new != null and $new[0] == $old[0] and $new > $old
                and .updateType == (if $new[1] == $old[1]
                  then "version-update:semver-patch" else "version-update:semver-minor" end);

            type == "array" and length > 0
              and ((map(.dependencyGroup) | unique) == ["maven-minor-patch"]
                or (length == 1 and .[0].dependencyGroup == ""))
              and (length == (unique_by(.dependencyName) | length))
              and all(.[];
                .packageEcosystem == "maven" and .directory == "/" and .targetBranch == "master"
                and (.dependencyName | type == "string" and test("^[^:[:space:]]+:[^:[:space:]]+$"))
                and permitted_update)
          ' > /dev/null <<< "$UPDATES"; then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
          fi

  merge:
    needs: metadata
    if: needs.metadata.outputs.eligible == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_ID: ${{ github.event.pull_request.node_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Wait for required Maven verification on the verified PR revision
        id: checks
        shell: bash
        run: |
          query=$(cat <<'GRAPHQL'
          query($id: ID!) {
            node(id: $id) {
              ... on PullRequest {
                state
                isDraft
                headRefOid
                headRepository { nameWithOwner }
                baseRefName
                author { login }
                files(first: 2) { totalCount nodes { path changeType } }
                commits(last: 1) {
                  totalCount
                  nodes {
                    commit {
                      oid
                      statusCheckRollup {
                        contexts(first: 100) {
                          nodes {
                            ... on CheckRun {
                              name
                              status
                              conclusion
                              startedAt
                              isRequired(pullRequestId: $id)
                              checkSuite {
                                workflowRun {
                                  event
                                  runNumber
                                  runAttempt
                                  file { path }
                                  workflow { name }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          GRAPHQL
          )

          deadline=$((SECONDS + 25 * 60))
          while (( SECONDS < deadline )); do
            request=$(gh api graphql -f query="$query" -f id="$PR_ID" --jq '.data.node')
            result=$(jq -r --arg head "$PR_HEAD_SHA" --arg repo "$GITHUB_REPOSITORY" '
              def latest_maven_check:
                [ .[]
                  | select(.name == "Maven verify" and .checkSuite.workflowRun.workflow.name == "Java CI with Maven"
                    and .checkSuite.workflowRun.file.path == ".github/workflows/maven.yml"
                    and .checkSuite.workflowRun.event == "pull_request") ]
                | sort_by([.checkSuite.workflowRun.runNumber, .checkSuite.workflowRun.runAttempt, .startedAt]) | last;
              .commits.nodes[0].commit as $commit
              | if .state != "OPEN" or .isDraft or .headRefOid != $head or $commit.oid != $head
                  or .headRepository.nameWithOwner != $repo or .baseRefName != "master"
                  or .author.login != "dependabot[bot]" or .commits.totalCount != 1 or .files.totalCount != 1
                  or .files.nodes[0].path != "pom.xml" or .files.nodes[0].changeType != "MODIFIED"
                then "ineligible"
                else ($commit.statusCheckRollup.contexts.nodes // [])
                  | latest_maven_check
                  | if . == null then "pending"
                    elif (.isRequired | not) then "not-required"
                    elif .status != "COMPLETED" then "pending"
                    elif .conclusion == "SUCCESS" then "passed"
                    else "failed"
                    end
                end' <<< "$request")
            case "$result" in
              passed)
                echo 'passed=true' >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              pending)
                sleep 15
                ;;
              *)
                echo "Leaving the pull request for manual review ($result)."
                exit 0
                ;;
            esac
          done
          echo "::warning::Maven verification did not finish within 25 minutes."

      - name: Squash merge the verified revision
        id: merge
        if: steps.checks.outputs.passed == 'true'
        shell: bash
        run: |
          # The merge endpoint enforces branch protection and rejects a changed PR head.
          merged=$(gh api --method PUT "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/merge" \
            -f sha="$PR_HEAD_SHA" -f merge_method=squash --jq '.merged')
          if [[ "$merged" != "true" ]]; then
            echo "::error::GitHub did not merge the pull request."
            exit 1
          fi
          echo 'merged=true' >> "$GITHUB_OUTPUT"

      # A merge made with GITHUB_TOKEN does not trigger the dependency graph workflow.
      - name: Dispatch Maven dependency submission
        if: steps.merge.outputs.merged == 'true'
        run: gh workflow run maven.yml --ref master --repo "$GITHUB_REPOSITORY"
