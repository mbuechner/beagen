<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta content="Michael Büchner" name="author">
    <meta name="description" content="Beagen – BEACON-Datei-Generator der Deutschen Digitalen Bibliothek">
    <meta name="theme-color" content="#0d6efd">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/spacelab/bootstrap.min.css" integrity="sha256-DJuTtrnkM7UA6ptLT9fJumXkYY5NovkL55ITeigpSsI=" crossorigin="anonymous">
    <title>Beagen - Ein BEACON-Datei-Generator für die Deutsche Digitale Bibliothek</title>
  </head>
  <body>
    <main class="container mt-2">
      <div class="bg-light mb-4 rounded-2 p-5 mt-3">
        <h1 class="display-4" title="${project.name} v${project.version}">${project.name}</h1>
        <p class="lead">Ein BEACON-Datei-Generator für die Deutsche Digitale Bibliothek</p>
        <hr class="my-4">
        <div id="alert_placeholder"></div>
        <div class="row">
          <div class="col-md-4">
            <label class="col-form-label" for="selectType">Typ</label>
            <select class="form-select" id="selectType">
              <option selected="" value="organisation">Organisation</option>
              <option value="person">Person</option>
              <option value="newspaper">Zeitungstitel</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="col-form-label" for="selectSector">Kultursparte</label>
            <select class="form-select" id="selectSector">
              <option value="all">Alle</option>
              <option value="archive">Archive</option>
              <option value="library">Bibliothek</option>
              <option value="monumentprotection">Denkmalpflege</option>
              <option value="research">Forschung</option>
              <option value="media">Mediathek</option>
              <option value="museum">Museum</option>
              <option value="other">Sonstige</option>
            </select>
          </div>
          <div class="col-md-4 align-self-end">
            <a class="btn btn-primary mt-3" id="showBtn">Anzeigen</a>
          </div>
          <div class="col-md-12 mt-2">
            <div class="form-check form-switch">
              <input checked="checked" class="form-check-input" id="selectorAll" type="checkbox">
              <label class="form-check-label" for="selectorAll">Nur aktuellste anzeigen</label>
            </div>
          </div>
        </div>
        <br>
        <p id="listStatus" role="status"></p>
        <div class="row" id="beaconTableRow" hidden>
          <div class="table-responsive">
            <table class="table table-hover table-striped" id="beaconTable" aria-label="BEACON-Dateien">
              <thead>
                <tr>
                  <th scope="col"><button class="btn btn-link p-0 text-reset text-start" type="button">Typ <span aria-hidden="true"></span></button></th>
                  <th scope="col"><button class="btn btn-link p-0 text-reset text-start" type="button">Kultursparte <span aria-hidden="true"></span></button></th>
                  <th scope="col"><button class="btn btn-link p-0 text-reset text-start" type="button">Erstellungsdatum <span aria-hidden="true"></span></button></th>
                  <th scope="col"><button class="btn btn-link p-0 text-reset text-start" type="button">Anzahl <span aria-hidden="true"></span></button></th>
                  <th scope="col"><button class="btn btn-link p-0 text-reset text-start" type="button">Direktlink <span aria-hidden="true"></span></button></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
        <div class="row" id="chartRow" hidden>
          <div class="col-12 mt-4">
            <div class="card card-body">
              <canvas id="beaconChart" role="img" aria-label="Verlauf der Anzahl in der ausgewählten BEACON-Datei"></canvas>
            </div>
          </div>
        </div>
      </div>
    </main>
    <template id="chartAssets">
      <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.2/dist/chart.umd.min.js" integrity="sha256-PyiPTyaILCa1iTH7WGqbTzA3C13jjWncAFsL0FsI4RM=" crossorigin="anonymous"></script>
    </template>
    <script>
      (() => {
        const currentUrl = new URL(window.location.href);
        // Match the route suffix so switching views preserves a reverse proxy's path prefix.
        const listPath = currentUrl.pathname.replace(/\/list(?:\/latest)?\/?$/, "/list");
        const latest = /\/latest\/?$/.test(currentUrl.pathname);
        const type = document.getElementById("selectType");
        const sector = document.getElementById("selectSector");
        const latestOnly = document.getElementById("selectorAll");
        const showButton = document.getElementById("showBtn");
        const status = document.getElementById("listStatus");
        const table = document.getElementById("beaconTable");
        const chartAssets = document.getElementById("chartAssets").content;
        const sortButtons = Array.from(table.querySelectorAll("thead button"));
        const columns = [
          entry => entry.type?.name ?? "",
          entry => entry.sector?.name ?? "",
          entry => entry.created ?? "",
          entry => entry.count ?? "",
          entry => entry["@id"] ?? "",
        ];
        const collator = new Intl.Collator("de", { numeric: true });
        let sortColumn = 2;
        let descending = true;
        let entries = [];

        function makeLink(value) {
          const text = String(value ?? "").trim();
          if (text) {
            try {
              const url = new URL(text, document.baseURI);
              if (url.protocol === "http:" || url.protocol === "https:") {
                const link = document.createElement("a");
                link.href = url.href;
                link.textContent = text;
                return link;
              }
            } catch {
              // Display an invalid URL as text.
            }
          }
          return document.createTextNode(text);
        }

        function showAlert(message, link) {
          const alert = document.createElement("div");
          alert.className = link ? "alert alert-primary" : "alert alert-danger";
          alert.setAttribute("role", link ? "status" : "alert");
          alert.append(message);
          if (link) {
            alert.append(" ", makeLink(link));
          }
          const closeButton = document.createElement("button");
          closeButton.type = "button";
          closeButton.className = "btn btn-sm btn-outline-secondary";
          closeButton.textContent = "Schließen";
          closeButton.addEventListener("click", () => {
            alert.remove();
            showButton.focus();
          });
          alert.append(" ", closeButton);
          document.getElementById("alert_placeholder").replaceChildren(alert);
        }

        function updateFilter() {
          // Newspaper feeds always use the aggregate sector.
          sector.disabled = type.value === "newspaper";
          if (sector.disabled) {
            sector.value = "all";
          }
          const url = new URL(currentUrl.origin);
          url.pathname = listPath + (latestOnly.checked ? "/latest" : "");
          url.search = new URLSearchParams({ type: type.value, sector: sector.value });
          showButton.href = url.href;
        }

        for (const [name, select] of [["type", type], ["sector", sector]]) {
          select.value = (currentUrl.searchParams.get(name) ?? "").toLowerCase();
          if (!select.value) {
            select.selectedIndex = 0;
          }
          select.addEventListener("change", updateFilter);
        }
        latestOnly.checked = latest;
        latestOnly.addEventListener("change", updateFilter);
        updateFilter();

        if (latest) {
          const latestUrl = new URL(currentUrl.origin);
          latestUrl.pathname = listPath.slice(0, -"/list".length) + "/item/" + type.value + "/" + sector.value + "/latest";
          showAlert("Direktlink zur aktuellsten BEACON-Datei.", latestUrl.href);
        }

        function renderTable() {
          document.getElementById("beaconTableRow").hidden = false;
          const body = table.tBodies[0];
          body.replaceChildren();
          for (const [index, button] of sortButtons.entries()) {
            const heading = button.closest("th");
            const indicator = button.querySelector("span");
            if (index === sortColumn) {
              heading.setAttribute("aria-sort", descending ? "descending" : "ascending");
              indicator.textContent = descending ? "↓" : "↑";
            } else {
              heading.removeAttribute("aria-sort");
              indicator.textContent = "↕";
            }
          }
          if (!entries.length) {
            const cell = body.insertRow().insertCell();
            cell.colSpan = columns.length;
            cell.textContent = "Keine Einträge gefunden.";
            return;
          }
          const value = columns[sortColumn];
          const sorted = entries.slice().sort((left, right) => {
            const a = value(left);
            const b = value(right);
            const comparison = typeof a === "number" && typeof b === "number" ? a - b : collator.compare(a, b);
            return descending ? -comparison : comparison;
          });
          for (const entry of sorted) {
            const row = body.insertRow();
            for (const column of columns.slice(0, -1)) {
              row.insertCell().textContent = column(entry);
            }
            row.insertCell().append(makeLink(entry["@id"]));
          }
        }
        for (const [index, button] of sortButtons.entries()) {
          button.addEventListener("click", () => {
            descending = sortColumn === index && !descending;
            sortColumn = index;
            renderTable();
          });
        }

        function loadChart() {
          const source = chartAssets.querySelector("script");
          const script = document.createElement("script");
          script.src = source.src;
          script.integrity = source.integrity;
          script.crossOrigin = source.crossOrigin;
          script.addEventListener("load", () => {
            // The API returns newest first. Keep chart dates chronological regardless of table sorting.
            const history = entries.slice().reverse();
            const chartRow = document.getElementById("chartRow");
            chartRow.hidden = false;
            try {
              new window.Chart(document.getElementById("beaconChart"), {
                type: "line",
                data: {
                  labels: history.map(entry => entry.created.split("T")[0]),
                  datasets: [{ label: "Entwicklung der Anzahl", data: history.map(entry => entry.count) }],
                },
                options: { scales: { y: { beginAtZero: true } } },
              });
            } catch (error) {
              chartRow.hidden = true;
              console.warn("Das Verlaufsdiagramm konnte nicht angezeigt werden.", error);
            }
          }, { once: true });
          document.head.append(script);
        }

        async function loadEntries() {
          status.textContent = "BEACON-Dateien werden geladen.";
          try {
            // The same URL serves the browser page and the JSON data through content negotiation.
            const response = await fetch(showButton.href, { headers: { Accept: "application/json" } });
            if (!response.ok) {
              const error = await response.json().catch(() => null);
              throw new Error(error?.title ?? "HTTP " + response.status);
            }
            const data = await response.json();
            if (!Array.isArray(data)) {
              throw new Error("Ungültige Antwort des Servers.");
            }
            entries = data;
            renderTable();
            if (!latest && entries.length) {
              loadChart();
            }
          } catch (error) {
            showAlert("Die BEACON-Dateien konnten nicht geladen werden. " + error.message);
          } finally {
            status.textContent = "";
          }
        }

        loadEntries();
      })();
    </script>
  </body>
</html>
